name: Update game card
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/games.yml'
      - 'profile/steam-stats.yml'
      - 'profile/assets/**'
      - 'README.md'
permissions:
  contents: read
concurrency:
  group: game-card-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  generate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    uses: mcthesw/game-shelf-card/.github/workflows/update-card.yml@v0.1.0
    with:
      config: profile/steam-stats.yml
      output: profile/games.png
    secrets:
      steam-api-key: ${{ secrets.STEAM_TOKEN }}
